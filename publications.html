<!DOCTYPE html>
<html lang="en" id="html-root">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Publications by Mohammad Ashfaq Ur Rahman, Research Intern at CCDS, IUB. Academic research and conference papers."
    />
    <title>Publications | Academic Profile</title>
    <script>
      document.documentElement.classList.add("js");
      try {
        var t = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.classList.add(t);
      } catch (e) {}
    </script>
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Host+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/main.css" />
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="header-partial"></div>

    <main id="main">
      <header class="container page-head">
        <p class="section-label" data-rise>
          <span class="section-label__dot"></span><span class="section-label__num">03</span
          ><span class="section-label__name">Publications</span>
        </p>
        <div class="page-title">
          <h1 class="display-l"><span class="line"><span class="line__inner" style="--d: 0.1s">Publications</span></span></h1>
          <span id="publication-count" class="numeral page-title__count" data-rise style="--d: 0.4s"></span>
        </div>

        <div class="search" data-rise style="--d: 0.3s">
          <label class="search__field">
            <span class="visually-hidden">Search publications</span>
            <input type="search" id="publication-search" placeholder="Search publications..." autocomplete="off" />
            <svg class="icon search__icon" aria-hidden="true"><use href="#i-search"></use></svg>
          </label>
          <span class="label-s search__hint">Search by title, authors, or content</span>
        </div>
      </header>

      <section id="publications" class="container" style="padding-bottom: var(--section-y)">
        <div id="publications-md"></div>
      </section>
    </main>

    <div id="footer-partial"></div>

    <script src="scripts/site.js"></script>
    <script src="scripts/publications.js"></script>
    <script>
      const { escapeHtml, fetchText, reveal, stagger } = window.Site;
      const list = document.getElementById("publications-md");
      const searchInput = document.getElementById("publication-search");

      fetchText("content/publications.md")
        .then((md) => {
          const pubs = Publications.parse(md);
          document.getElementById("publication-count").textContent = `(${String(pubs.length).padStart(2, "0")})`;

          // Group by year, newest first (pubs are already sorted).
          const groups = [];
          for (const pub of pubs) {
            const key = pub.year || "—";
            let group = groups.find((g) => g.year === key);
            if (!group) groups.push((group = { year: key, items: [] }));
            group.items.push(pub);
          }

          list.innerHTML = groups.length
            ? groups
                .map(
                  (g) => `
                <section class="year-group" data-year-group>
                  <div class="year-group__year" data-reveal>
                    <h2 class="display-m">${escapeHtml(g.year)}</h2>
                    <span class="numeral">${String(g.items.length).padStart(2, "0")} / ${String(pubs.length).padStart(2, "0")}</span>
                  </div>
                  <div class="pub-list">${g.items.map(Publications.render).join("")}</div>
                </section>`
                )
                .join("")
            : `<p class="empty-state">No publications found.</p>`;

          list.querySelectorAll(".pub-list").forEach((l) => stagger(l.children, 90));
          reveal(list);
          initializeSearch();
        })
        .catch((err) => {
          console.error("Failed to load content/publications.md:", err);
          list.innerHTML = `<p class="empty-state">Could not load publications.</p>`;
        });

      function initializeSearch() {
        const items = Array.from(list.querySelectorAll(".publication-item"));
        const groups = Array.from(list.querySelectorAll("[data-year-group]"));

        searchInput.addEventListener("input", (e) => {
          const term = e.target.value.trim().toLowerCase();
          items.forEach((pub) => {
            const visible = pub.textContent.toLowerCase().includes(term);
            pub.hidden = !visible;
            if (visible) pub.classList.add("is-in");
          });
          groups.forEach((g) => (g.hidden = !g.querySelector(".publication-item:not([hidden])")));

          const anyVisible = items.some((pub) => !pub.hidden);
          let msg = document.getElementById("no-results-message");
          if (!anyVisible && !msg) {
            msg = document.createElement("p");
            msg.id = "no-results-message";
            msg.className = "empty-state";
            msg.textContent = "No publications found matching your search.";
            list.appendChild(msg);
          } else if (anyVisible && msg) {
            msg.remove();
          }
        });
      }
    </script>
  </body>
</html>
