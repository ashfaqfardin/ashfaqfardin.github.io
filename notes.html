<!DOCTYPE html>
<html lang="en" id="html-root">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Academic Notes of Mohammad Ashfaq Ur Rahman." />
    <title>Notes | Academic Profile</title>
    <script>
      document.documentElement.classList.add("js");
      try {
        var t = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.classList.add(t);
      } catch (e) {}
    </script>
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Host+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="header-partial"></div>

    <main id="main">
      <header class="container page-head">
        <p class="section-label" data-rise>
          <span class="section-label__dot"></span><span class="section-label__num">06</span
          ><span class="section-label__name">Notes</span>
        </p>
        <div class="page-title">
          <h1 class="display-l"><span class="line"><span class="line__inner" style="--d: 0.1s">Notes</span></span></h1>
          <span id="notes-count" class="numeral page-title__count" data-rise style="--d: 0.4s"></span>
        </div>
      </header>

      <div class="container">
        <div id="notes-list" class="notes-grid"></div>
      </div>
    </main>

    <div id="footer-partial"></div>
    <script src="scripts/site.js"></script>
    <script src="scripts/profile.js"></script>
  </body>
</html>
