<!DOCTYPE html>
<html lang="en" id="html-root">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An interactive timeline of my academic and professional journey." />
    <title>Timeline | Academic Profile</title>
    <script>
      document.documentElement.classList.add("js");
      try {
        var t = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.classList.add(t);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Host+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="header-partial"></div>

    <main id="main">
      <header class="container page-head">
        <p class="section-label" data-rise>
          <span class="section-label__dot"></span><span class="section-label__num">05</span
          ><span class="section-label__name">Timeline</span>
        </p>
        <h1 class="display-l"><span class="line"><span class="line__inner" style="--d: 0.1s">My Journey</span></span></h1>
        <p class="body-l page-sub" data-rise style="--d: 0.35s">A timeline of my key milestones and achievements.</p>
      </header>

      <div id="timeline-container" class="container timeline">
        <span class="timeline__rail" aria-hidden="true"></span>
        <span class="timeline__progress" aria-hidden="true"></span>
      </div>
    </main>

    <div id="footer-partial"></div>
    <script src="scripts/site.js"></script>
    <script>
      const { icon, escapeHtml, reveal } = window.Site;
      const container = document.getElementById("timeline-container");

      const createItem = (item) => `
        <article class="tl-item" data-reveal>
          <div class="tl-item__when">
            <p class="heading-s">${escapeHtml(item.date)}</p>
            <span class="tag">${escapeHtml(item.type)}</span>
          </div>
          <div class="tl-item__node" aria-hidden="true"></div>
          <div class="tl-item__card">
            <h2 class="heading-m">${escapeHtml(item.title)}</h2>
            <p>${escapeHtml(item.description)}</p>
            ${
              item.link
                ? `<a href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer" class="btn btn--subtle btn--sm">Read More ${icon("arrow-right", "icon--next")}</a>`
                : ""
            }
          </div>
        </article>`;

      // Fill the rail up to a reading line at 60% of the viewport and light up reached nodes.
      function trackProgress() {
        const rail = container.querySelector(".timeline__rail");
        const items = Array.from(container.querySelectorAll(".tl-item"));
        let ticking = false;
        const update = () => {
          const line = window.innerHeight * 0.6;
          const r = rail.getBoundingClientRect();
          const p = Math.min(1, Math.max(0, (line - r.top) / r.height));
          container.style.setProperty("--p", p.toFixed(4));
          items.forEach((item) => {
            const node = item.querySelector(".tl-item__node").getBoundingClientRect();
            item.classList.toggle("is-reached", node.top + 32 <= line);
          });
          ticking = false;
        };
        const request = () => {
          if (!ticking) {
            ticking = true;
            requestAnimationFrame(update);
          }
        };
        window.addEventListener("scroll", request, { passive: true });
        window.addEventListener("resize", request);
        update();
      }

      fetch("content/timeline.json")
        .then((res) => res.json())
        .then((items) => {
          container.insertAdjacentHTML("beforeend", items.map(createItem).join(""));
          reveal(container);
          trackProgress();
        })
        .catch((err) => console.error("Failed to load timeline data:", err));
    </script>
  </body>
</html>
