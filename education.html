<!DOCTYPE html>
<html lang="en" id="html-root">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Education history of Mohammad Ashfaq Ur Rahman, Research Intern at CCDS, IUB. Academic background and relevant courses."
    />
    <title>Education | Academic Profile</title>
    <script>
      document.documentElement.classList.add("js");
      try {
        var t = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.classList.add(t);
      } catch (e) {}
    </script>
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Host+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/main.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="header-partial"></div>

    <main id="main">
      <header class="container page-head">
        <p class="section-label" data-rise>
          <span class="section-label__dot"></span><span class="section-label__num">02</span
          ><span class="section-label__name">Education</span>
        </p>
        <div class="page-title">
          <h1 class="display-l"><span class="line"><span class="line__inner" style="--d: 0.1s">Education</span></span></h1>
          <span id="education-count" class="numeral page-title__count" data-rise style="--d: 0.4s"></span>
        </div>
      </header>

      <section id="education" class="container">
        <div id="education-md" class="edu-list"></div>
      </section>
    </main>

    <div id="footer-partial"></div>

    <script src="scripts/site.js"></script>
    <script>
      const { icon, escapeHtml, fetchText, reveal, stagger } = window.Site;

      // Entries separated by ---, fields are "[Name]" headers (lowercased keys).
      const parseEducation = (md) =>
        md
          .split(/\n-{3,}\n/)
          .map((e) => e.trim())
          .filter(Boolean)
          .map((entry) => {
            const fields = {};
            let currentField = "";
            entry.split("\n").forEach((line) => {
              const fieldMatch = line.match(/^\[([^\]]+)\]$/);
              if (fieldMatch) {
                currentField = fieldMatch[1].toLowerCase();
                fields[currentField] = "";
              } else if (currentField && line.trim()) {
                if (fields[currentField]) fields[currentField] += "\n";
                fields[currentField] += line.trim();
              }
            });
            return fields;
          });

      const createEducationRow = (edu, index) => {
        const currentName = edu["current_name"] || edu["current name"];
        const monogram = escapeHtml((edu.institute || "?").trim().charAt(0));
        const logoHtml = edu.logo
          ? `<div class="edu__logo"><img src="assets/images/${escapeHtml(edu.logo)}" alt="${escapeHtml(edu.institute)} logo" loading="lazy"
               onerror="this.parentNode.classList.add('edu__logo--mono');this.parentNode.textContent='${monogram}';" /></div>`
          : `<div class="edu__logo edu__logo--mono" aria-hidden="true">${monogram}</div>`;
        const badges = [
          edu.duration ? `<span class="tag">${icon("calendar")}${escapeHtml(edu.duration)}</span>` : "",
          edu.group ? `<span class="tag">${icon("book-open")}${escapeHtml(edu.group)}</span>` : "",
          edu.gpa ? `<span class="tag tag--brand">${icon("award")}GPA: ${escapeHtml(edu.gpa)}</span>` : "",
        ].join("");

        return `
          <article class="edu education-item" data-reveal>
            <span class="numeral edu__index">${String(index + 1).padStart(2, "0")}</span>
            ${logoHtml}
            <div class="edu__content">
              <h2 class="heading-l">${escapeHtml(edu.degree)}</h2>
              <p class="body-l edu__inst">${escapeHtml(edu.institute)}</p>
              ${currentName ? `<p class="label">Now: ${escapeHtml(currentName)}</p>` : ""}
              ${edu.additional ? `<p class="body-s edu__more">${marked.parseInline(edu.additional)}</p>` : ""}
            </div>
            <div class="edu__badges">${badges}</div>
          </article>`;
      };

      fetchText("content/education.md")
        .then((md) => {
          const education = parseEducation(md);
          const container = document.getElementById("education-md");
          container.innerHTML = education.map(createEducationRow).join("");
          document.getElementById("education-count").textContent = `(${String(education.length).padStart(2, "0")})`;
          stagger(container.children, 90);
          reveal(container);
        })
        .catch((err) => {
          console.error("Failed to load content/education.md:", err);
          document.getElementById("education-md").innerHTML =
            '<p class="empty-state">Failed to load education history. Please try again later.</p>';
        });
    </script>
  </body>
</html>
