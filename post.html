<!DOCTYPE html>
<html lang="en" id="html-root">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Notes | Academic Profile</title>
    <script>
      document.documentElement.classList.add("js");
      try {
        var t = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.classList.add(t);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Host+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/main.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="header-partial"></div>

    <main id="main">
      <article id="post-card" class="container post">
        <a href="notes.html" class="btn post__back" data-rise>
          <svg class="icon icon--prev" aria-hidden="true"><use href="#i-arrow-left"></use></svg>
          Back to All Posts
        </a>

        <div id="reading" class="reading" hidden>
          <div class="reading__meta">
            <span id="reading-title" class="label"></span>
            <span id="reading-count" class="numeral"></span>
          </div>
          <div class="reading__bar"><div id="reading-fill" class="reading__fill"></div></div>
        </div>

        <div id="post-content" class="prose">
          <p>Loading post...</p>
        </div>

        <nav id="pagination-controls" class="pagination" aria-label="Post pages"></nav>
      </article>
    </main>

    <div id="footer-partial"></div>
    <script src="scripts/site.js"></script>
    <script>
      const { icon, fetchText } = window.Site;
      const postContent = document.getElementById("post-content");
      const paginationControls = document.getElementById("pagination-controls");
      const reading = document.getElementById("reading");
      const postFile = new URLSearchParams(window.location.search).get("file");

      let pages = [];
      let currentPageIndex = 0;

      const updateChrome = (index) => {
        const total = pages.length;
        document.getElementById("reading-count").textContent = `${String(index + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}`;
        document.getElementById("reading-fill").style.setProperty("--p", (index + 1) / total);
        const indicator = document.getElementById("page-indicator");
        if (indicator) indicator.textContent = `Page ${index + 1} of ${total}`;
        const prev = document.getElementById("prev-button");
        const next = document.getElementById("next-button");
        if (prev) prev.disabled = index === 0;
        if (next) next.disabled = index === total - 1;
      };

      const renderPage = (index, animate) => {
        if (!pages[index]) return;
        const swap = () => {
          postContent.innerHTML = marked.parse(pages[index]);
          updateChrome(index);
          postContent.classList.remove("is-swapping");
        };
        if (!animate) return swap();

        postContent.classList.add("is-swapping");
        const top = document.getElementById("post-card").getBoundingClientRect().top + window.scrollY - 80;
        if (window.scrollY > top) window.scrollTo({ top, behavior: "smooth" });
        setTimeout(swap, 280);
      };

      if (postFile) {
        fetchText(`posts/${postFile}`)
          .then((md) => {
            pages = md
              .trim()
              .split(/^\s*---\s*$/m)
              .filter((p) => p.trim());

            if (pages.length === 0) {
              postContent.innerHTML = `<p>No content found in this file to create pages.</p>`;
              return;
            }

            const tempDiv = document.createElement("div");
            tempDiv.innerHTML = marked.parse(md);
            const firstHeading = tempDiv.querySelector("h1, h2, h3");
            if (firstHeading) {
              document.title = `${firstHeading.textContent} | Notes`;
              document.getElementById("reading-title").textContent = firstHeading.textContent;
            }

            if (pages.length > 1) {
              reading.hidden = false;
              paginationControls.innerHTML = `
                <button id="prev-button" class="btn" type="button">${icon("arrow-left", "icon--prev")}<span>Previous</span></button>
                <span id="page-indicator" class="label"></span>
                <button id="next-button" class="btn btn--primary" type="button"><span>Next</span>${icon("arrow-right", "icon--next")}</button>`;

              document.getElementById("prev-button").addEventListener("click", () => {
                if (currentPageIndex > 0) renderPage(--currentPageIndex, true);
              });
              document.getElementById("next-button").addEventListener("click", () => {
                if (currentPageIndex < pages.length - 1) renderPage(++currentPageIndex, true);
              });
              document.addEventListener("keydown", (e) => {
                if (e.target.closest("input, textarea")) return;
                if (e.key === "ArrowRight" && currentPageIndex < pages.length - 1) renderPage(++currentPageIndex, true);
                if (e.key === "ArrowLeft" && currentPageIndex > 0) renderPage(--currentPageIndex, true);
              });
            }

            renderPage(currentPageIndex, false);
          })
          .catch((err) => {
            postContent.innerHTML = `<p>Sorry, the requested post could not be found.</p>`;
            console.error(err);
          });
      } else {
        postContent.innerHTML = `<p>No post specified.</p>`;
      }
    </script>
  </body>
</html>
