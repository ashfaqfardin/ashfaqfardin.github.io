<!DOCTYPE html>
<html lang="en" id="html-root">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Projects by Mohammad Ashfaq Ur Rahman, Research Intern at CCDS, IUB. Software, research, and technical work."
    />
    <title>Projects | Academic Profile</title>
    <script>
      document.documentElement.classList.add("js");
      try {
        var t = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.classList.add(t);
      } catch (e) {}
    </script>
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Host+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/main.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="header-partial"></div>

    <main id="main">
      <header class="container page-head">
        <p class="section-label" data-rise>
          <span class="section-label__dot"></span><span class="section-label__num">04</span
          ><span class="section-label__name">Projects</span>
        </p>
        <div class="page-title">
          <h1 class="display-l"><span class="line"><span class="line__inner" style="--d: 0.1s">Projects</span></span></h1>
          <span id="projects-count" class="numeral page-title__count" data-rise style="--d: 0.4s"></span>
        </div>
      </header>

      <div class="container">
        <div id="projects-container" class="projects"></div>
      </div>
    </main>

    <div id="footer-partial"></div>

    <script src="scripts/site.js"></script>
    <script>
      const { icon, escapeHtml, fetchText, reveal, stagger, initSpotlight } = window.Site;
      const container = document.getElementById("projects-container");

      // "## Title | [GitHub](url)" or "## Title | Private Repository", followed by a description.
      const parseProject = (chunk) => {
        const lines = chunk.trim().split("\n");
        const heading = lines[0].match(/^#{1,3}\s+(.+)$/);
        if (!heading) return { body: chunk };
        const [title, ...rest] = heading[1].split(" | ");
        const meta = rest.join(" | ").trim();
        const link = meta.match(/\[([^\]]+)\]\(([^)]+)\)/);
        return {
          title: title.trim(),
          linkLabel: link ? link[1] : meta,
          url: link ? link[2] : "",
          body: lines.slice(1).join("\n").trim(),
        };
      };

      const createProjectCard = (p, index) => {
        const num = `<span class="numeral">${String(index + 1).padStart(2, "0")}</span>`;
        let link = "";
        if (p.url && p.url !== "#") {
          link = `<a class="project__link" href="${escapeHtml(p.url)}" target="_blank" rel="noopener noreferrer">
              <span class="label">${escapeHtml(p.linkLabel)}</span><span class="chip">${icon("arrow-up-right")}</span></a>`;
        } else if (p.linkLabel) {
          link = `<span class="project__link"><span class="label">${escapeHtml(p.linkLabel)}</span></span>`;
        }
        return `
          <article class="project" data-reveal data-spotlight>
            <div class="project__top">${num}${link}</div>
            <div class="project__bottom">
              ${p.title ? `<h2 class="heading-l project__title">${escapeHtml(p.title)}</h2>` : ""}
              ${p.body ? `<div class="project__desc">${marked.parse(p.body)}</div>` : ""}
            </div>
          </article>`;
      };

      fetchText("content/projects.md")
        .then((md) => {
          const projects = md
            .split(/\n(?=#{1,3} )/)
            .filter((p) => p.trim() !== "")
            .map(parseProject);
          container.innerHTML = projects.map(createProjectCard).join("");
          document.getElementById("projects-count").textContent = `(${String(projects.length).padStart(2, "0")})`;
          stagger(container.children, 90);
          reveal(container);
          initSpotlight(container);
        })
        .catch((err) => {
          console.error("Failed to load content/projects.md:", err);
          container.innerHTML = `<p class="empty-state">Could not load projects. Please check the console for errors.</p>`;
        });
    </script>
  </body>
</html>
